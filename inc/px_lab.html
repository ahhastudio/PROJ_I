<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>픽셀 인물</title>
<style>
  body { margin:0; padding:16px; background:#141217; color:#e8dcc4; font:14px "Noto Sans KR",sans-serif; }
  h1 { margin:0 0 4px; font-size:18px; } p { margin:0 0 12px; color:#b8aa90; }
  .bar { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; margin-bottom:12px; }
  .bar button { padding:6px 12px; border-radius:6px; border:1px solid #6d5a3c; background:#2a2018; color:#e8dcc4; cursor:pointer; }
  .bar button.on { background:#5a4020; border-color:#f0c070; }
  .bar label { cursor:pointer; user-select:none; }
  .bar input[type=number] { background:#2a2018; color:#e8dcc4; border:1px solid #6d5a3c; border-radius:4px; padding:3px 6px; }
  #flC { display:block; image-rendering:pixelated; }
  #flMini { image-rendering:pixelated; }
  .warn { color:#e0a050; }
</style>
</head>
<body>
<section id="qpx" style="margin-bottom:28px">
<h1>픽셀 비교</h1>
<div class="bar" id="qBar"><button data-k="idle">대기</button><button data-k="walk">걷기</button><button data-k="atk">공격</button><button data-k="hit">맞기</button><button data-k="die">쓰러짐</button><button data-r="-1">◀</button><button data-r="1">▶</button><button data-spin="1">돌리기</button><button data-g="0">파티 1</button><button data-g="1">파티 2</button><button data-g="2">파티 3</button><button data-h="40">키 40</button><button data-h="56">키 56</button><button data-z="1">1배</button><button data-z="2">2배</button><button data-z="3">3배</button></div>
<div style="overflow-x:auto"><canvas id="qS" style="image-rendering:pixelated;display:block;margin-bottom:10px"></canvas></div>
<div style="overflow-x:auto"><canvas id="qM" style="image-rendering:pixelated;display:block;margin-bottom:10px"></canvas></div>
<div style="overflow-x:auto"><canvas id="qC" style="image-rendering:pixelated;display:block"></canvas></div>
</section>
<script>
// 픽셀 비교: 이전(char_lab/cls) · 새로(char_lab/q — 줄 = 8방향, 칸 = 대기 4 · 걷기 8 · 공격. 공격 자리 · 장마다 ms는 meta.json)
(() => {
  const CELL = { 56: 115, 40: 82 }, NF = { idle: 4, walk: 8 }, OFF = { idle: 0, walk: 4 }, FPS = { idle: 4, walk: 10 };
  const CLS = [['파이터', 'fighter'], ['팔라딘', 'paladin'], ['바바리안', 'barbarian'], ['몽크', 'monk'], ['로그', 'rogue'], ['레인저', 'ranger'], ['드루이드', 'druid'], ['클레릭', 'cleric'], ['위저드', 'wizard'], ['소서러', 'sorcerer'], ['워락', 'warlock'], ['바드', 'bard']];
  const MON = [['고블린', 'goblin'], ['오크', 'orc'], ['오크 주술사', 'orcsham'], ['오우거', 'ogre'], ['트롤', 'troll'], ['임프', 'imp'], ['망령', 'wraith'], ['스펙터', 'specter'], ['점액', 'ooze'], ['버섯 괴물', 'fungus'], ['늑대', 'wolf'], ['헬하운드', 'hellhound'], ['겨울 늑대', 'winterwolf']], ISM = {};
  for (const [, n] of MON) ISM[n] = 1;
  const FOES = [['goblin', 'orc', 'orcsham', 'wolf'], ['ogre', 'troll', 'imp', 'hellhound'], ['wraith', 'specter', 'ooze', 'fungus']];
  const MA = { off: 12, dur: [110, 110, 90, 60, 60, 110, 110, 100, 320] }, MD = { hit: [21, [90, 130, 150, 350]], die: [24, [110, 110, 110, 110, 110, 1400]] };
  const PARTY = [['fighter', 'cleric', 'wizard', 'ranger'], ['paladin', 'barbarian', 'sorcerer', 'rogue'], ['monk', 'druid', 'warlock', 'bard']];
  const q = new URLSearchParams(location.search), img = src => { const i = new Image(); i.src = src; return i; };
  const oldI = {}, newI = { 40: {}, 56: {} }, bg = img('char_lab/bg.png');
  let meta = null, AT = null, kind = ['idle', 'walk', 'atk', 'hit', 'die'].includes(q.get('k')) ? q.get('k') : 'atk', dir = 1, spin = false, Z = +q.get('z') || 2, H = +q.get('h') === 56 ? 56 : 40, G = +q.get('g') || 0;
  for (const [, n] of CLS) oldI[n] = img(`char_lab/cls/cls_${n}.png?v=3`);
  for (const n of [...CLS.map(c => c[1]), ...MON.map(c => c[1])]) for (const h of [40, 56]) newI[h][n] = img(`char_lab/q/${ISM[n] ? 'm_' : ''}${n}_${h}.png?v=3`);
  fetch('char_lab/cls/cls_meta.json').then(r => r.json()).then(d => { meta = d; }).catch(() => {});
  fetch('char_lab/q/meta.json?v=3').then(r => r.json()).then(d => { for (const k in d) d[k].sum = d[k].dur.reduce((a, c) => a + c); MA.sum = MA.dur.reduce((a, c) => a + c); for (const [, n] of MON) d[n] = MA; AT = d; }).catch(() => {});
  const cv = document.getElementById('qC'), x = cv.getContext('2d'), sv = document.getElementById('qS'), y = sv.getContext('2d');
  const off = document.createElement('canvas'), ox = off.getContext('2d');
  const mark = () => { for (const b of document.querySelectorAll('#qBar button')) { const D = b.dataset; b.classList.toggle('on', D.k ? D.k === kind : D.z ? +D.z === Z : D.h ? +D.h === H : D.g ? +D.g === G : D.spin ? spin : false); } };
  document.getElementById('qBar').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const D = b.dataset;
    if (D.k) kind = D.k; if (D.r) dir = (dir + +D.r + 8) % 8; if (D.z) Z = +D.z; if (D.h) H = +D.h; if (D.g) G = +D.g; if (D.spin) spin = !spin;
    mark();
  });
  const mod = (a, n) => ((a % n) + n) % n;
  function frame(n, k, t) { // → 그림 안 칸 번호
    if (MD[k]) {
      if (!ISM[n]) return mod(Math.floor(t * 4), 4);
      const [o, D] = MD[k]; let m = mod(t * 1000, D.reduce((a, c) => a + c)), i = 0; while (m >= D[i]) m -= D[i++]; return o + (k === 'hit' ? i % 3 : i);
    }
    if (k !== 'atk') return OFF[k] + mod(Math.floor(t * FPS[k]), NF[k]);
    const A = AT[n]; let m = mod(t * 1000, A.sum), i = 0; while (m >= A.dur[i]) m -= A.dur[i++]; return A.off + i;
  }
  function put(c, n, k, t, d, fx, fy, tint) { // fx · fy = 발
    const im = newI[H][n], S = CELL[H]; if (!im.naturalWidth || !AT) return;
    off.width = off.height = S; ox.drawImage(im, frame(n, k, t) * S, d * S, S, S, 0, 0, S, S);
    if (tint) { ox.globalCompositeOperation = 'source-atop'; ox.fillStyle = tint; ox.fillRect(0, 0, S, S); }
    c.drawImage(off, Math.round(fx - S / 2), Math.round(fy - S * .723));
  }
  // 배경 장면: 배경 그림은 한 점이 2px라 반으로 줄여 인물과 같은 점 크기로
  const CR = [480, 190, 600, 560];
  function scene(t) {
    const w = CR[2] / 2, h = CR[3] / 2; if (sv.width !== w * Z || sv.height !== h * Z) { sv.width = w * Z; sv.height = h * Z; }
    y.setTransform(Z, 0, 0, Z, 0, 0); y.imageSmoothingEnabled = false; y.fillStyle = '#17161a'; y.fillRect(0, 0, w, h);
    if (bg.naturalWidth) y.drawImage(bg, CR[0], CR[1], CR[2], CR[3], 0, 0, w, h);
    if (!AT) return;
    const k = H / 56, P = [];
    const duel = (a, b, X, Y, s) => { // a가 오른쪽 아래의 b를 본다 · 차례로 휘두른다
      const u = mod(t + s, (AT[a].sum + AT[b].sum) / 1000), A = kind === 'atk' && u < AT[a].sum / 1000, Bq = kind === 'atk' && !A, rest = kind === 'atk' ? 'idle' : kind;
      P.push([a, A ? 'atk' : rest, A ? u : t, 1, X, Y], [b, Bq ? 'atk' : rest, Bq ? u - AT[a].sum / 1000 : t + .3, 5, X + 50 * k, Y + 30 * k]);
    };
    const [a, b, c, d] = PARTY[G], [f, g, m1, m2] = FOES[G];
    duel(a, f, 152, 146, 0); duel(b, g, 104, 194, 1.4);
    P.push([c, kind, t, 1, 58, 206], [d, kind, t + .5, 1, 112, 140], [m1, kind, t, 7, 262, 146], [m2, kind === 'atk' ? 'walk' : kind, t + .4, 5, 232, 228]);
    P.sort((m, n) => m[5] - n[5]);
    for (const [n, kk, tt, dd, X, Y] of P) { // 횃불 방 앞이 밝다: 멀수록 푸르게 눌러 준다
      const r = Math.min(1, Math.hypot((X - 140) / 150, (Y - 140) / 90)); put(y, n, kk, tt, dd, X, Y, `rgba(${Math.round(60 - 44 * r)},${Math.round(34 - 14 * r)},${Math.round(14 + 16 * r)},${(.14 + .26 * r).toFixed(2)})`);
    }
  }
  const mv = document.getElementById('qM'), z = mv.getContext('2d');
  function mtable(t) {
    const N = innerWidth < 700 ? 3 : 7, CW = 92, CH = 112, w = CW * N, R = Math.ceil(MON.length / N), h = CH * R, d = spin ? Math.floor(t / .8) % 8 : dir;
    if (mv.width !== w * Z || mv.height !== h * Z) { mv.width = w * Z; mv.height = h * Z; }
    z.setTransform(Z, 0, 0, Z, 0, 0); z.imageSmoothingEnabled = false; z.fillStyle = '#364e32'; z.fillRect(0, 0, w, h);
    MON.forEach(([, n], i) => put(z, n, kind, t + i * .13, d, CW * (i % N) + CW / 2, CH * Math.floor(i / N) + CH - 26));
    z.setTransform(1, 0, 0, 1, 0, 0); z.fillStyle = '#e8dcc4'; z.font = '13px "Noto Sans KR",sans-serif'; z.textAlign = 'center';
    MON.forEach(([s], i) => z.fillText(s, (CW * (i % N) + CW / 2) * Z, CH * Math.floor(i / N) * Z + 18));
  }
  function table(t) {
    const kk = MD[kind] ? 'idle' : kind, N = innerWidth < 700 ? 3 : 6, CW = 104, CH = 92, LW = 24, TOP = 14, RH = CH * 2 + TOP, w = LW + CW * N, h = RH * CLS.length / N, d = spin ? Math.floor(t / .8) % 8 : dir;
    if (cv.width !== w * Z || cv.height !== h * Z) { cv.width = w * Z; cv.height = h * Z; }
    x.setTransform(Z, 0, 0, Z, 0, 0); x.imageSmoothingEnabled = false;
    for (let r = 0; r < CLS.length / N; r++) { x.fillStyle = r % 2 ? '#314730' : '#364e32'; x.fillRect(0, r * RH, w, RH); }
    CLS.forEach(([, n], i) => {
      const cx = LW + CW * (i % N) + CW / 2, Y = Math.floor(i / N) * RH + TOP, m = meta && meta[n];
      if (m && oldI[n].naturalWidth) x.drawImage(oldI[n], Math.floor(t * m.fps) % m.n[kk] * m.w, m.rows.indexOf(kk) * m.h, m.w, m.h, Math.round(cx - m.w / 2), Y + CH - 20 - m.foot, m.w, m.h);
      put(x, n, kind, t, d, cx, Y + CH * 2 - 22);
    });
    x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = '#e8dcc4'; x.font = '13px "Noto Sans KR",sans-serif'; x.textAlign = 'center';
    CLS.forEach(([s], i) => x.fillText(s, (LW + CW * (i % N) + CW / 2) * Z, Math.floor(i / N) * RH * Z + 18));
    x.textAlign = 'left'; for (let r = 0; r < CLS.length / N; r++) { x.fillText('이전', 6, (r * RH + TOP + CH / 2) * Z); x.fillText('새로', 6, (r * RH + TOP + CH * 1.5) * Z); }
  }
  (function loop(now) { const t = (now || 0) / 1000; scene(t); mtable(t); table(t); requestAnimationFrame(loop); })();
  mark();
})();
</script>
</body>
</html>
